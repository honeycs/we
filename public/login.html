<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - CS 1.6 Panel</title>
    <style>
        body { 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            background: #12141c; 
            background-image: linear-gradient(rgba(18, 20, 28, 0.95), rgba(18, 20, 28, 0.95)), 
                              radial-gradient(#ff9800 0.5px, transparent 0.5px);
            background-size: 24px 24px;
            color: #fff; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
        }
        .login-card { 
            background: #1a1f2c; 
            padding: 40px; 
            border-radius: 12px; 
            box-shadow: 0 8px 32px rgba(0,0,0,0.5); 
            width: 320px; 
            border: 1px solid #2d3748; 
        }
        h2 { margin-top: 0; text-align: center; color: #ff9800; font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
        input { 
            width: 100%; 
            padding: 12px; 
            margin: 12px 0; 
            background: #0d1117; 
            border: 1px solid #2d3748; 
            color: #fff; 
            border-radius: 6px; 
            box-sizing: border-box; 
            font-size: 14px;
            transition: border-color 0.2s;
        }
        input:focus { outline: none; border-color: #ff9800; }
        button { 
            width: 100%; 
            padding: 12px; 
            background: #ff9800; 
            color: #12141c; 
            font-weight: 700; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 15px; 
            transition: background 0.2s;
        }
        button:hover { background: #e68a00; }
        #errorMsg { color: #ff5252; text-align: center; font-size: 13px; margin-top: 12px; font-weight: 500; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>CS 1.6 WebUI Login</h2>
        <form id="loginForm">
            <input type="text" id="username" placeholder="Username" required autocomplete="username">
            <input type="password" id="password" placeholder="Password" required autocomplete="current-password">
            <button type="submit">Access Dashboard</button>
        </form>
        <div id="errorMsg"></div>
    </div>

    <!-- Login scripts bundled into a safe, clean execution model to keep inline CSP filters happy -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('loginForm');
            if (!form) return;
            
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                const errorMsg = document.getElementById('errorMsg');
                errorMsg.innerText = "";

                try {
                    const res = await fetch('/api/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    });
                    const data = await res.json();
                    
                    if (res.ok && data.success) {
                        window.location.href = '/';
                    } else {
                        errorMsg.innerText = data.error || "Invalid username or password";
                    }
                } catch (err) {
                    errorMsg.innerText = "Connection lost to API panel backend.";
                }
            });
        });
    </script>
</body>
</html>
