<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Statistics - CS 1.6 Panel</title>
    <style>
        body { 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            background: #12141c; 
            background-image: linear-gradient(rgba(18, 20, 28, 0.95), rgba(18, 20, 28, 0.95)), 
                              radial-gradient(#ff9800 0.5px, transparent 0.5px);
            background-size: 24px 24px;
            color: #e2e8f0; 
            margin: 0; 
            padding: 12px; 
        }
        .container { max-width: 1100px; margin: 0 auto; width: 100%; box-sizing: border-box; }
        
        .header-bar { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid #2d3748; 
            padding-bottom: 16px; 
            margin-bottom: 24px; 
            gap: 12px;
        }
        h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.5px; color: #fff; }
        h3 { margin-top: 0; color: #fff; font-weight: 600; font-size: 18px; }
        
        .card { 
            background: #1a1f2c; 
            border: 1px solid #2d3748; 
            padding: 16px; 
            border-radius: 12px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.25);
            box-sizing: border-box;
            width: 100%;
        }
        
        /* Table scroll guard rule wrapper mapping components */
        .table-responsive-wrapper { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; margin-top: 14px; }
        table { width: 100%; border-collapse: collapse; min-width: 650px; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #2d3748; font-size: 14px; }
        th { background: #141822; color: #a0aec0; font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px; }
        tr:hover td { background: rgba(255,255,255,0.02); }
        .rank-badge { background: #ff9800; color: #12141c; font-weight: 800; padding: 2px 6px; border-radius: 4px; font-size: 12px; }
        
        .nav-link-btn { 
            background: transparent; 
            border: 1px solid #ff9800; 
            color: #ff9800; 
            text-decoration: none; 
            padding: 10px 14px; 
            border-radius: 6px; 
            font-weight: 600; 
            font-size: 14px; 
            display: inline-block; 
            text-align: center;
            transition: all 0.2s;
        }
        .nav-link-btn:hover { background: rgba(255, 152, 0, 0.1); color: #fff; }

        @media (max-width: 768px) {
            body { padding: 8px; }
            .header-bar { flex-direction: column; align-items: flex-start; gap: 12px; }
            .nav-link-btn { width: 100%; box-sizing: border-box; }
            h1 { font-size: 18px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-bar">
            <h1>📊 Performance Leaderboard</h1>
            <a href="/" class="nav-link-btn">🎮 Back to Console</a>
        </div>

        <div class="card">
            <h3>Top Ranked Players (AMX Mod X)</h3>
            <div class="table-responsive-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Rank</th>
                            <th>Alias</th>
                            <th>Network Auth ID</th>
                            <th>Kills</th>
                            <th>Deaths</th>
                            <th>Headshots</th>
                            <th>K/D Ratio</th>
                        </tr>
                    </thead>
                    <tbody id="statsTableBody">
                        <tr><td colspan="7">Scraping server rankings cache records...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="/js/stats.js"></script>
</body>
</html>
