<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Server Statistics - CS 1.6 Panel</title>
    <style>
        body { 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            background: #12141c; 
            background-image: linear-gradient(rgba(18, 20, 28, 0.95), rgba(18, 20, 28, 0.95)), 
                              radial-gradient(#ff9800 0.5px, transparent 0.5px);
            background-size: 24px 24px;
            color: #e2e8f0; 
            margin: 0; 
            padding: 24px; 
        }
        .container { max-width: 1100px; margin: 0 auto; }
        .header-bar { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid #2d3748; 
            padding-bottom: 16px; 
            margin-bottom: 24px; 
        }
        h1 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -0.5px; color: #fff; }
        h3 { margin-top: 0; color: #fff; font-weight: 600; }
        .card { 
            background: #1a1f2c; 
            border: 1px solid #2d3748; 
            padding: 24px; 
            border-radius: 12px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.25);
        }
        table { width: 100%; border-collapse: collapse; margin-top: 14px; }
        th, td { text-align: left; padding: 14px; border-bottom: 1px solid #2d3748; font-size: 14px; }
        th { background: #141822; color: #a0aec0; font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px; }
        tr:hover td { background: rgba(255,255,255,0.02); }
        .rank-badge { background: #ff9800; color: #12141c; font-weight: 800; padding: 2px 8px; border-radius: 4px; font-size: 12px; }
        button { 
            background: #2d3748; 
            color: #edf2f7; 
            border: 1px solid #4a5568; 
            padding: 10px 16px; 
            cursor: pointer; 
            border-radius: 6px; 
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
        }
        button:hover { background: #4a5568; color: #fff; }
        .nav-link-btn { background: transparent; border-color: #ff9800; color: #ff9800; text-decoration: none; padding: 10px 16px; border-radius: 6px; font-weight: 600; font-size: 14px; display: inline-block; }
        .nav-link-btn:hover { background: rgba(255, 152, 0, 0.1); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-bar">
            <h1>📊 Server Performance Leaderboard</h1>
            <div>
                <a href="/" class="nav-link-btn">🎮 Back to Console</a>
            </div>
        </div>

        <div class="card">
            <h3>Top Ranked Players (AMX Mod X)</h3>
            <table>
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Alias</th>
                        <th>Network Auth ID</th>
                        <th>Kills</th>
                        <th>Deaths</th>
                        <th>Headshots</th>
                        <th>K/D Ratio</th>
                    </tr>
                </thead>
                <tbody id="statsTableBody">
                    <tr><td colspan="7">Scraping server rankings cache records...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Complies with strict script-src CSP filters using isolated data handling sheets -->
    <script src="/js/stats.js"></script>
</body>
</html>
