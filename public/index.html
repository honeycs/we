<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CS 1.6 Dashboard</title>
    <style>
        body { 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            background: #12141c; 
            background-image: linear-gradient(rgba(18, 20, 28, 0.95), rgba(18, 20, 28, 0.95)), 
                              radial-gradient(#ff9800 0.5px, transparent 0.5px);
            background-size: 24px 24px;
            color: #e2e8f0; 
            margin: 0; 
            padding: 24px; 
        }
        .container { max-width: 1100px; margin: 0 auto; }
        .header-bar { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid #2d3748; 
            padding-bottom: 16px; 
            margin-bottom: 24px; 
        }
        h1 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -0.5px; color: #fff; }
        h2, h3 { margin-top: 0; color: #fff; font-weight: 600; }
        .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 24px; }
        @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
        .card { 
            background: #1a1f2c; 
            border: 1px solid #2d3748; 
            padding: 24px; 
            border-radius: 12px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.25);
            transition: transform 0.2s, border-color 0.2s;
        }
        .card:hover { border-color: #4a5568; }
        .status-badge { 
            display: inline-flex; 
            align-items: center; 
            gap: 6px;
            padding: 6px 12px; 
            border-radius: 20px; 
            font-size: 13px;
            font-weight: 600; 
            letter-spacing: 0.5px;
        }
        .online { background: rgba(46, 125, 50, 0.15); color: #4caf50; border: 1px solid rgba(46, 125, 50, 0.3); }
        .offline { background: rgba(198, 40, 40, 0.15); color: #f44336; border: 1px solid rgba(198, 40, 40, 0.3); }
        button { 
            background: #2d3748; 
            color: #edf2f7; 
            border: 1px solid #4a5568; 
            padding: 10px 16px; 
            cursor: pointer; 
            border-radius: 6px; 
            margin: 4px; 
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        button:hover { background: #4a5568; color: #fff; border-color: #718096; }
        button.danger { background: rgba(198, 40, 40, 0.2); color: #ff5252; border: 1px solid rgba(198, 40, 40, 0.4); }
        button.danger:hover { background: #c62828; color: #fff; border-color: #ff5252; }
        button.logout-btn { background: transparent; border-color: #4a5568; color: #a0aec0; }
        button.logout-btn:hover { background: rgba(255,255,255,0.05); color: #fff; }
        table { width: 100%; border-collapse: collapse; margin-top: 14px; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #2d3748; font-size: 14px; }
        th { background: #141822; color: #a0aec0; font-weight: 600; text-transform: uppercase; font-size: 12px; letter-spacing: 0.5px; }
        tr:hover td { background: rgba(255,255,255,0.01); }
        #console { 
            background: #0d1117; 
            color: #58a6ff; 
            font-family: 'Fira Code', 'Courier New', monospace; 
            padding: 16px; 
            height: 220px; 
            overflow-y: auto; 
            border-radius: 8px; 
            margin-top: 16px; 
            white-space: pre-wrap;
            border: 1px solid #21262d;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.5);
        }
        .input-group { margin-top: 16px; display: flex; box-shadow: 0 2px 6px rgba(0,0,0,0.2); border-radius: 6px; overflow: hidden; }
        #customCmd { 
            flex: 1; 
            padding: 12px 16px; 
            background: #0d1117; 
            border: 1px solid #2d3748; 
            border-right: none;
            color: #fff; 
            font-size: 14px;
            font-family: monospace;
        }
        #customCmd:focus { outline: none; border-color: #4a5568; }
        #executeCmdBtn { margin: 0; border-radius: 0 6px 6px 0; background: #ff9800; color: #12141c; border: none; font-weight: 700; }
        #executeCmdBtn:hover { background: #e68a00; }
        
        /* Modifying status layout to cleanly encapsulate the preview card element wrapper */
        .server-controls { margin-bottom: 24px; }
        .status-flex-wrapper { display: flex; justify-content: space-between; align-items: center; gap: 20px; }
        @media (max-width: 600px) { .status-flex-wrapper { flex-direction: column; align-items: flex-start; } }
        
        /* Map thumbnail image custom display cards layout styling */
        .map-preview-box {
            width: 120px;
            height: 70px;
            border-radius: 6px;
            border: 1px solid #2d3748;
            background: #0d1117;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .map-preview-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .select-group { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
        select { 
            width: 100%; 
            padding: 12px; 
            background: #0d1117; 
            border: 1px solid #2d3748; 
            color: #fff; 
            border-radius: 6px; 
            font-size: 14px; 
            font-weight: 600;
        }
        select:focus { outline: none; border-color: #ff9800; }
        .config-btn-stack { display: flex; flex-direction: column; gap: 4px; margin-top: 10px; }
        .config-btn-stack button { text-align: left; padding: 12px 16px; margin: 0; width: 100%; }

        .scoreboard-card {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            background: #141822;
            border: 1px solid #2d3748;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 24px;
            box-shadow: inset 0 2px 15px rgba(0,0,0,0.4);
        }
        .team-block { display: flex; flex-direction: column; align-items: center; min-width: 100px; }
        .team-name { font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 4px; }
        .team-t { color: #de9b35; text-shadow: 0 0 8px rgba(222,155,53,0.3); }
        .team-ct { color: #5c8cb3; text-shadow: 0 0 8px rgba(92,140,179,0.3); }
        .score-display { font-size: 42px; font-weight: 800; font-family: monospace; line-height: 1; }
        .score-divider { font-size: 28px; color: #4a5568; font-weight: 700; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-bar">
            <h1>CS 1.6 Server Commander</h1>
            <button class="logout-btn" id="logoutBtn">🚪 Logout</button>
        </div>

        <div class="scoreboard-card">
            <div class="team-block team-t">
                <span class="team-name">Terrorists</span>
                <span class="score-display" id="tScore">0</span>
            </div>
            <div class="score-divider">:</div>
            <div class="team-block team-ct">
                <span class="team-name">Counter-Terrorists</span>
                <span class="score-display" id="ctScore">0</span>
            </div>
        </div>
        
        <div class="card server-controls">
            <div class="status-flex-wrapper">
                <div>
                    <h2 id="serverName">Fetching server info...</h2>
                    <p>Status: <span id="serverStatus" class="status-badge offline">Checking...</span> | Current Map: <b id="currentMap">-</b></p>
                </div>
                <!-- Dynamic custom thumbnail image card allocation placeholder container -->
                <div class="map-preview-box">
                    <img id="mapPreviewImg" src="data:image/svg+xml;utf8,<svg xmlns='http://w3.org' width='100' height='70' viewBox='0 0 100 70'><rect width='100' height='70' fill='%230d1117'/><circle cx='50' cy='35' r='10' stroke='%232d3748' stroke-width='2' fill='none'/></svg>" alt="Map Preview">
                </div>
            </div>
            <div style="margin-top: 16px;">
                <button class="rcon-action-btn" data-cmd="sv_restart 1">🔄 Restart Round</button>
                <button id="softRebootBtn">🔌 Soft Reboot Server (Quit Command)</button>
            </div>
        </div>

        <div class="grid">
            <div>
                <div class="card">
                    <h3>Active Players</h3>
                    <table>
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>SteamID</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="playerTableBody">
                            <tr><td colspan="3">No players online or server unreachable.</td></tr>
                        </tbody>
                    </table>
                </div>

                <div class="card" style="margin-top: 24px;">
                    <h3>Live RCON Console</h3>
                    <div id="console"></div>
                    <div class="input-group">
                        <input type="text" id="customCmd" placeholder="Type RCON command (e.g., mp_timelimit 30)...">
                        <button id="executeCmdBtn">Execute</button>
                    </div>
                </div>
            </div>

            <div class="card">
                <h3>Change Map</h3>
                <div class="select-group">
                    <select id="mapDropdown">
